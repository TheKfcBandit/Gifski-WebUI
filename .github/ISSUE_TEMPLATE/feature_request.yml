name: Feature request
description: Suggest an encoding control or workflow improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What task is difficult with the current controls?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed behavior
      description: Describe the expected result and any relevant encoder options.
    validations:
      required: true
